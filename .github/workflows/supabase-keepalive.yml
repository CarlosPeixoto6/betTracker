# Mantém o projeto Supabase ativo (ping diário) e o próprio workflow ativo (commit vazio após 45 dias sem atividade).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 * * *'   # todos os dias às 09:17 UTC
  workflow_dispatch:        # permite execução manual para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping à API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/plataformas?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Ping falhou"
            exit 1
          fi

  keep-repo-active:
    # Evita que o GitHub desative este workflow após 60 dias sem atividade no repositório.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit vazio se o último commit tiver mais de 45 dias
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Último commit há $age_days dias"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive para evitar desativação dos workflows [skip ci]"
            git push
          fi
