# Mantém o projeto Supabase ativo com um pedido diário à API REST.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 * * *'   # todos os dias às 09:17 UTC
  workflow_dispatch:        # permite execução manual para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping à API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/plataformas?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Ping falhou"
            exit 1
          fi
