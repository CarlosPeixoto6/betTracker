name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * 0,3'   # Domingo e Quarta, 08:00 UTC
  workflow_dispatch: {}      # permite correr manualmente para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (query leve à tabela configuracoes)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://oolqasggtevxspsjhday.supabase.co/rest/v1/configuracoes?select=chave&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
